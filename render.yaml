services:
  - type: web
    name: us-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your TiDB Cloud connection string here after creating the service
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://your-app.vercel.app
      - key: SUPABASE_URL
        sync: false # Supabase project URL — required, Render's disk is ephemeral (see backend/.env.example)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase service_role key (Project Settings -> API)
      - key: SUPABASE_STORAGE_BUCKET
        value: uploads
