services:
  mysql:
    image: mysql:8.0
    container_name: us-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: us_local_dev
      MYSQL_DATABASE: us_dev
      MYSQL_USER: us
      MYSQL_PASSWORD: us_local_dev
    ports:
      - "3306:3306"
    volumes:
      - us_mysql_data:/var/lib/mysql

volumes:
  us_mysql_data:
