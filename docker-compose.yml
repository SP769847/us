services:
  postgres:
    image: postgres:16-alpine
    container_name: us-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: us
      POSTGRES_PASSWORD: us_local_dev
      POSTGRES_DB: us_dev
    ports:
      - "5432:5432"
    volumes:
      - us_postgres_data:/var/lib/postgresql/data

volumes:
  us_postgres_data:
